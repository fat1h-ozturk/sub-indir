[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sub-indir"
version = "0.3.0"
description = "Yalnızca Türkçe altyazıya odaklı, akıllı altyazı indirme CLI aracı."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "sub-indir Team"}
]
keywords = ["subtitles", "turkish", "altyazi", "cli", "turkcealtyazi", "subliminal"]
dependencies = [
    "guessit>=3.8.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "charset-normalizer>=3.3.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "InquirerPy>=0.3.4",
    "pymediainfo>=3.6.0",
    "subliminal>=2.1.0"
]

[project.scripts]
sub-indir = "sub_indir.cli:main"
